name: Build KARKAS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Android wrapper
        run: flutter create . --project-name karkas --org com.karkas --platforms android

      # ДОБАВЛЕНО: Переименование приложения в KARKAS
      - name: Rename App to KARKAS
        run: sed -i 's/android:label="karkas"/android:label="KARKAS"/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karkas-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
