name: Build KARKAS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Android scaffold
        run: |
          flutter create --org com.karkas --project-name karkas --platforms android /tmp/karkas_scaffold
          cp -r /tmp/karkas_scaffold/android .
      - name: Install dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karkas-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
